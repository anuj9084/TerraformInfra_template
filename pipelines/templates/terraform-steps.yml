parameters:
  - name: serviceConnection
    type: string
    default: 'anuj-pipeline-sc'
    displayName: "Azure Service Connection Name"
  
  - name: workingDirectory
    type: string
    default: '$(System.DefaultWorkingDirectory)'
    displayName: "Working Directory (Jahan Terraform files hain)"

  - name: tfvarsFile
    type: string
    default: ''
    displayName: "Path to .tfvars file (optional)"

  - name: terraformVersion
    type: string
    default: '1.9.5'
    displayName: "Terraform Version"

  - name: runApply
    type: boolean
    default: false
    displayName: "Apply step run karna hai ya nahi"

steps:
  # Step 1: Terraform CLI install karna
  - task: TerraformInstaller@0
    displayName: 'Terraform Install (v${{ parameters.terraformVersion }})'
    inputs:
      terraformVersion: '${{ parameters.terraformVersion }}'

  # Step 2: Terraform Init (AzureCLI task ke through authentication milti hai)
  - task: AzureCLI@2
    displayName: 'Terraform Init'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      workingDirectory: '${{ parameters.workingDirectory }}'
      addSpnToEnvironment: true
      inlineScript: |
        echo "##[section] Initializing Terraform..."
        
        # Service Principal credentials set karna environment variables me
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_CLIENT_SECRET="$servicePrincipalKey"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
        
        terraform init

  # Step 3: Terraform Validate (Syntax check karne ke liye)
  - task: AzureCLI@2
    displayName: 'Terraform Validate'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      workingDirectory: '${{ parameters.workingDirectory }}'
      inlineScript: |
        echo "##[section] Validating Terraform configuration..."
        terraform validate

  # Step 4: Terraform Plan (Dry-run dekhne ke liye kya create hoga)
  - task: AzureCLI@2
    displayName: 'Terraform Plan'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      workingDirectory: '${{ parameters.workingDirectory }}'
      addSpnToEnvironment: true
      inlineScript: |
        echo "##[section] Running Terraform Plan..."
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_CLIENT_SECRET="$servicePrincipalKey"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
        
        TFVARS_ARG=""
        if [ -n "${{ parameters.tfvarsFile }}" ]; then
          TFVARS_ARG="-var-file=${{ parameters.tfvarsFile }}"
        fi
        
        terraform plan $TFVARS_ARG -out=tfplan

  # Step 5: Terraform Apply (Sirf tab chalega jab runApply = true hoga)
  - ${{ if eq(parameters.runApply, true) }}:
    - task: AzureCLI@2
      displayName: 'Terraform Apply'
      inputs:
        azureSubscription: '${{ parameters.serviceConnection }}'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '${{ parameters.workingDirectory }}'
        addSpnToEnvironment: true
        inlineScript: |
          echo "##[section] Applying Terraform Changes..."
          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_CLIENT_SECRET="$servicePrincipalKey"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          
          terraform apply -auto-approve tfplan
