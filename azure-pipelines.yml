trigger: none

pool:
  name: 'AgentUserDefinedPool'

parameters:
- name: environment
  displayName: 'Select Environment'
  type: string
  default: dev
  values:
    - dev
    - prod

variables:
- ${{ if eq(parameters.environment, 'dev') }}:
  - template: template/variables/dev-variables.yml

- ${{ if eq(parameters.environment, 'prod') }}:
  - template: template/variables/prod-variables.yml

stages:

- stage: Terraform
  displayName: 'Terraform ${{ parameters.environment }}'

  jobs:
  - job: Terraform_Deploy
    displayName: 'Terraform Deploy'

    steps:
    - template: template/terraform.yml